schema_version: 1

context:
  name: django-loginas
  version: 0.3.11

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/django-loginas-${{ version }}.tar.gz
  sha256: 37aec6fcd1cdb72378b69d2468d2ae39b12cd013f838a9bf9b9b5132e8341735

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6

tests:
  - python:
      imports:
        - loginas
      pip_check: true

      python_version: ${{ python_min }}.*
about:
  summary: An app to add a "Log in as user" button in the Django user admin page.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/stochastic-technologies/django-loginas/

extra:
  recipe-maintainers:
    - pavelzw
